system linux-guest

cpu

ram 0x80000000,160M
pass loc mem:0x8A000000,0x36000000,m=0x8A000000
pass loc mem:0x1c00000000,0x40000000,m=0x1c00000000

load /tmp/Image
fdt load /tmp/qnxhyp-r8a78000-ironhide-uio.dtb
######################
# Static rootfilesystem
######################
# cmdline "console=ttyAMA0 earlycon=pl011,0x1c090000 debug rootfstype=ext4 rootwait root=/dev/vda rw loglevel=7 pd_ignore_unused clk_ignore_unused"
# vdev virtio-blk loc 0x30000 intr gic:34 hostdev /tmp/rootfs-2-5G-ext4.diskimage

# OR

######################
# Dynamic rootfilesystem
# hostPC's IP: The IP address of HostPC
# rootfilesystem: path of Linux guest's rootfs on HostPC
# board's ip: The IP address of Linux guest, must not same as QNX Host's IP address
######################
cmdline "console=ttyAMA0 earlycon=pl011,0x1c090000 rw root=/dev/nfs nfsroot=<hostPC's IP>:<rootfilesystem>,nfsvers=3 ip=<board's ip>:::::eth0 pd_ignore_unused clk_ignore_unused"

vdev pl011 hostdev \>- loc 0x1c090000 intr gic:37 name vdev_pl011
vdev virtio-console loc 0x20000000 intr gic:42
# This is for guest-to-host
vdev virtio-net
    loc 0x1c0c0000
    intr gic:40
    name p2p
    peer /dev/vdevpeers/vp0
    mac 02:12:34:56:78:10

logger info,verbose stdout
